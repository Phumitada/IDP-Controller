---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata:
  name: manager-role
rules:
- apiGroups:
  - ""
  resources:
  - secrets
  verbs:
  - create
  - get
  - list
  - watch
  - watch (make sure cluster has admission to do reconcile for secret)
- apiGroups:
  - ""
  resources:
  - services
  verbs:
  - create
  - get
  - list
  - update
  - watch
- apiGroups:
  - apps
  resources:
  - statefulsets
  verbs:
  - create
  - get
  - list
  - update
  - watch
- apiGroups:
  - paas.internal
  resources:
  - applications
  - databases
  verbs:
  - create
  - delete
  - get
  - list
  - patch
  - update
  - watch
- apiGroups:
  - paas.internal
  resources:
  - applications/finalizers
  - databases/finalizers
  verbs:
  - update
- apiGroups:
  - paas.internal
  resources:
  - applications/status
  - databases/status
  verbs:
  - get
  - patch
  - update
